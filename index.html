<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Online Nursery Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Online Nursery</h1>
      <nav>
        <a href="#">Home</a>
        <a href="#plants">Plants</a>
        <a href="#order">Order</a>
        <a href="#manage">Manage</a>
      </nav>
    </header>
    <main>
      <section id="plants">
        <h2>Available Plants</h2>
        <div id="plant-list"></div>
      </section>

      <section id="manage">
        <h2>Manage Plants</h2>
        <form id="plantForm">
          <input type="hidden" name="id" id="plantId" />
          <input
            type="text"
            name="name"
            id="plantName"
            placeholder="Plant Name"
            required
          />
          <input
            type="number"
            name="price"
            id="plantPrice"
            placeholder="Price"
            step="0.01"
            min="0"
            required
          />
          <button type="submit">Save Plant</button>
          <button type="button" id="clearBtn">Clear</button>
        </form>
        <div id="manage-response"></div>
      </section>

      <section id="order">
        <h2>Order a Plant</h2>
        <form id="orderForm">
          <input type="text" name="plant" placeholder="Plant Name" required />
          <input
            type="number"
            name="quantity"
            placeholder="Quantity"
            min="1"
            required
          />
          <input type="text" name="customer" placeholder="Your Name" required />
          <button type="submit">Place Order</button>
        </form>
        <div id="order-response"></div>
      </section>
    </main>
    <footer>
      <p>&copy; 2025 Online Nursery</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
